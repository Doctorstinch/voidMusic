<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxSong — AI Song Creator</title>
  <meta name="description" content="Create original AI songs with custom voices, genres, and lyrics. Free prototype." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-2: #1a1a24;
      --border: #2a2a3a;
      --text: #f0f0f5;
      --text-muted: #9898a8;
      --accent: #7c5cff;
      --accent-hover: #9178ff;
      --male: #4f8cff;
      --female: #ff6b9d;
      --success: #34d399;
      --radius: 14px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124, 92, 255, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(79, 140, 255, 0.08), transparent);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding-top: 20px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent), #ff6b9d);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 22px;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: 6px;
    }

    .badge {
      display: inline-block;
      background: rgba(124, 92, 255, 0.15);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      margin-top: 12px;
      letter-spacing: 0.02em;
    }

    .main-grid {
      display: grid;
      gap: 24px;
    }

    @media (min-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr 340px;
        align-items: start;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .gender-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab.active-male {
      background: rgba(79, 140, 255, 0.15);
      border-color: var(--male);
      color: var(--male);
    }

    .tab.active-female {
      background: rgba(255, 107, 157, 0.15);
      border-color: var(--female);
      color: var(--female);
    }

    .voice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .voice-card {
      background: var(--surface-2);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }

    .voice-card:hover {
      border-color: var(--border);
      background: #22222e;
    }

    .voice-card.selected-male {
      border-color: var(--male);
      background: rgba(79, 140, 255, 0.12);
    }

    .voice-card.selected-female {
      border-color: var(--female);
      background: rgba(255, 107, 157, 0.12);
    }

    .voice-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin: 0 auto 8px;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      font-weight: 600;
    }
